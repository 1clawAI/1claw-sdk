name: Publish to npm

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  path: sdk

            - uses: actions/checkout@v4
              with:
                  repository: 1clawAI/1claw-openapi-spec
                  path: openapi-spec

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - working-directory: sdk
              run: npm install

            - working-directory: sdk
              run: npm run build

            # Trusted Publishing (OIDC): npmjs.com → @1claw/sdk → Trusted Publisher (1clawAI/1claw-sdk).
            - working-directory: sdk
              run: npm publish --provenance --access public
