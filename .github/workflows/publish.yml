name: Publish to npm

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: npm
        steps:
            - uses: actions/checkout@v4
              with:
                  path: sdk

            - uses: actions/checkout@v4
              with:
                  repository: 1clawAI/1claw-openapi-spec
                  path: openapi-spec

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - working-directory: sdk
              run: npm install

            - working-directory: sdk
              run: npm run build

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            # Node 22 bundles npm 10.x, which cannot do Trusted Publishing: it
            # sends no credential, and npm reports the failed auth as a 404 on
            # the package. The range enforces the floor the feature requires
            # rather than trusting whatever @latest happens to be.
            - name: Upgrade npm to a Trusted-Publishing-capable version
              run: |
                  # Pinned exactly, not @latest or a range. This runs in a job holding
                  # id-token: write and an npm environment, immediately before
                  # publishing public packages -- so whatever this resolves to
                  # executes with the credential that publishes them. A floating
                  # version makes that an unreviewed third-party input on every run.
                  # Bump deliberately: raise the number here, in one commit, across
                  # every publish workflow.
                  npm install -g npm@11.5.1
                  npm --version

            - working-directory: sdk
              run: npm publish --provenance --access public
