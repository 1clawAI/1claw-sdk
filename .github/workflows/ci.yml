name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 22

            - run: npm install

            - run: npm run build

            # The spec-coverage test reads ../openapi-spec/openapi.json, the
            # sibling submodule in the monorepo layout. A standalone clone of
            # this repo has no sibling, so CI was red on every push since
            # 10-13. The spec repo is public; a shallow clone is enough.
            - name: Check out the OpenAPI spec beside the SDK
              run: git clone --depth 1 https://github.com/1clawAI/1claw-openapi-spec.git ../openapi-spec

            - run: npm test
